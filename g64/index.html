<!doctype html>
<html lang="es" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gavilanbe 64 · La colección de juegos en cartucho</title>
<meta name="description" content="La habitación de gavilanbe 64: todos los juegos de gavilanbe en cartuchos del color del modelo que los hizo. Coge uno de la pared, mételo en la consola y pulsa START.">
<meta name="theme-color" content="#130e2e">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../fonts/titan-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Titan One";src:url(../fonts/titan-latin.woff2) format("woff2");font-display:block}
@font-face{font-family:"Fredoka";src:url(../fonts/fredoka-latin.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(../fonts/bricolage-latin.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(../fonts/jbmono-latin.woff2) format("woff2");font-weight:100 800;font-display:swap}
:root{
  --ink:#130e2e;--deep:#0c0822;--p1:#2d2480;--p2:#1c1552;--line:#5a4fd0;--mute:#bdb6f2;--paper:#fff7e8;
  --sun:#ffd93b;--sun2:#ff9d2e;--orange:#ff5b35;--lime:#b8f02a;--teal:#2fd9c8;--grape:#8a5cff;--pink:#ff5fa2;--red:#ff3d4a;--pl:#ff7a5c;
  --title:"Titan One","Fredoka",system-ui,sans-serif;--ui:"Fredoka",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --pop:cubic-bezier(.3,1.7,.5,1);--out:cubic-bezier(.2,.8,.2,1);--pad:22px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:var(--ui);font-weight:500;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
svg{display:block}

/* ── piezas del sistema de menús ── */
/* rótulo de juego: relleno en degradado sobre trazo grueso de tinta */
.tt{--g:linear-gradient(180deg,#fff7b0 8%,var(--sun) 44%,var(--sun2) 92%);position:relative;display:inline-block;isolation:isolate;font-family:var(--title);font-weight:400;line-height:.98;letter-spacing:.005em;color:transparent}
.tt::before,.tt::after{content:attr(data-t);position:absolute;inset:0}
.tt::before{color:var(--ink);-webkit-text-stroke:.24em var(--ink);text-shadow:0 .1em 0 var(--ink),0 .19em 0 rgba(8,4,26,.45)}
.tt::after{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.tt.hot{--g:linear-gradient(180deg,#ffb199 8%,var(--orange) 46%,#e0241a 92%)}
/* panel oscuro con canto de luz */
.pnl{background:linear-gradient(180deg,var(--p1),var(--p2));border:3px solid var(--deep);border-radius:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.25),0 6px 0 var(--deep),0 14px 30px rgba(8,4,26,.4)}
/* botón con volumen: se hunde al pulsarlo */
.btn{--c1:#fff;--c2:#e7e2ff;--tx:var(--ink);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--title);color:var(--tx);background:linear-gradient(180deg,var(--c1),var(--c2));border:3px solid var(--deep);border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -4px 0 rgba(0,0,0,.16),0 6px 0 var(--deep);transition:transform .16s var(--pop),box-shadow .16s,filter .15s;white-space:nowrap;user-select:none}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -4px 0 rgba(0,0,0,.16),0 8px 0 var(--deep);filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.16),0 1px 0 var(--deep)}
.btn.lime{--c1:#dcff6b;--c2:#9fdc12}.btn.sun{--c1:#ffe96a;--c2:#ffb52e}.btn.dark{--c1:#3a30a0;--c2:#241b6c;--tx:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.25),0 6px 0 var(--deep)}
.btn svg{width:20px;height:20px;flex:none}
/* glifos del mando */
.gl{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;font-family:var(--title);font-size:13px;line-height:1;color:#fff;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),transparent 42%),var(--c,var(--grape));border:2.5px solid var(--deep);box-shadow:0 3px 0 var(--deep);text-shadow:0 1.5px 0 rgba(0,0,0,.35);flex:none}
.gl.a{--c:var(--orange)}.gl.b{--c:#7cc20e}.gl.s{--c:var(--red);font-size:10px;letter-spacing:.06em;padding:0 9px}.gl svg{width:18px;height:10px}
.gl.k{--c:#3a30a0;font-family:var(--mono);font-weight:700;font-size:12px;border-radius:8px}

/* ── cabecera ── */
.top{position:fixed;inset:0 0 auto 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:max(18px,env(safe-area-inset-top)) var(--pad) 0;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:33px;transition:transform .3s var(--pop)}
.logo:hover{transform:rotate(-2deg) scale(1.04)}
.logo .emb{width:46px;height:46px;filter:drop-shadow(0 4px 0 var(--deep))}
.logo .emb{transition:transform .6s var(--pop)}.logo:hover .emb{transform:rotate(360deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px}
.tabs button{position:relative;height:42px;padding:0 16px 0 12px;border-radius:99px;display:flex;align-items:center;gap:8px;font-family:var(--title);font-size:15.5px;color:var(--mute);transition:color .2s,transform .2s var(--pop)}
.tabs button svg{width:20px;height:20px}
.tabs button:hover{color:#fff;transform:translateY(-1px)}
.tabs button[aria-pressed=true]{color:var(--ink)}
.tabs .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:linear-gradient(180deg,#ffe96a,#ffb52e);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 var(--deep);transition:left .45s var(--pop),width .45s var(--pop);pointer-events:none}
.tabs button>*{position:relative}
.tools{display:flex;gap:10px}
.tools .btn{height:50px;min-width:50px;padding:0 16px;font-size:16px;border-radius:99px}
#snd{padding:0}
#snd[aria-pressed=false] .w{display:none}#snd[aria-pressed=true] .x{display:none}

/* ── ficha del cartucho ── */
.card{position:fixed;left:var(--pad);bottom:max(22px,env(safe-area-inset-bottom));width:min(440px,calc(100vw - 2*var(--pad)));z-index:5;pointer-events:none}
.card>*{pointer-events:auto;opacity:0;transform:translateY(26px)}
.card.on>*{animation:rise .55s var(--pop) forwards}
.card.on>*:nth-child(2){animation-delay:.05s}.card.on>*:nth-child(3){animation-delay:.09s}.card.on>*:nth-child(4){animation-delay:.13s}.card.on>*:nth-child(5){animation-delay:.17s}
@keyframes rise{to{opacity:1;transform:none}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bdg{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;font-family:var(--title);font-size:13.5px;letter-spacing:.02em;border:2.5px solid var(--deep);box-shadow:0 3px 0 var(--deep);background:linear-gradient(180deg,#3a30a0,#241b6c);color:#fff}
.bdg.model{background:linear-gradient(180deg,color-mix(in srgb,var(--pl) 78%,#fff),var(--pl));color:var(--pink-ink,var(--ink))}
.bdg.model svg{width:15px;height:14px}
.bdg.new{background:linear-gradient(180deg,#dcff6b,#9fdc12);color:var(--ink);animation:wob 2.4s ease-in-out infinite}
.bdg.wip{background:linear-gradient(180deg,#ffe96a,#ffb52e);color:var(--ink)}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.05)}}
.card h2{font-size:clamp(44px,5.4vw,70px);display:block;width:fit-content;max-width:100%;text-wrap:balance;overflow-wrap:anywhere;padding-bottom:.12em}
.card h2.long{font-size:clamp(32px,3.5vw,46px)}
.card .sub{font-family:var(--title);font-size:19px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;margin-top:2px}
.desc{margin-top:12px;padding:13px 16px 12px;font-size:16px;line-height:1.36;color:#efeaff}
.desc p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.desc.open p{-webkit-line-clamp:unset}
.desc .more{display:inline-flex;margin-top:6px;font-family:var(--title);font-size:12.5px;letter-spacing:.04em;color:var(--sun);text-transform:uppercase}
.desc .cmd{display:flex;gap:8px;margin-top:9px;padding:8px 11px;border-radius:10px;background:var(--deep);font-family:var(--mono);font-size:12px;color:#8dffad;overflow:hidden}
.desc .cmd code{font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:9px;margin-top:16px}
.play{flex:1;height:66px;font-size:25px;border-radius:22px;gap:12px}
.play .gl{height:30px;font-size:11px;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.14)}}
.rnd{width:54px;height:54px;border-radius:50%;padding:0}
.count{margin-top:12px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 8px var(--ink)}

/* ── leyenda de controles ── */
.keys{position:fixed;right:var(--pad);bottom:max(22px,env(safe-area-inset-bottom));z-index:4;display:flex;gap:16px;align-items:center;padding:10px 16px;border-radius:99px;font-family:var(--title);font-size:14.5px;pointer-events:none}
.keys span{display:inline-flex;align-items:center;gap:7px}
.tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;font-family:var(--title);font-size:16px;color:var(--ink);background:linear-gradient(180deg,#ffe96a,#ffb52e);border:3px solid var(--deep);box-shadow:0 5px 0 var(--deep);opacity:0;white-space:nowrap;transition:opacity .1s}
.tip.on{opacity:1}
.tip i{width:16px;height:16px;border-radius:5px;background:var(--c);border:2px solid var(--deep)}
.tip small{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.06em;opacity:.7;text-transform:uppercase}

/* ── buscador ── */
.panel{position:fixed;top:14px;right:14px;bottom:14px;width:min(410px,calc(100vw - 28px));z-index:8;display:flex;flex-direction:column;transform:translateX(calc(100% + 40px)) rotate(2deg);transition:transform .5s var(--pop);overflow:hidden}
.panel.on{transform:none}
.p-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px 20px}
.p-h h3{font-size:32px}
.p-h small{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin-top:6px;text-transform:uppercase}
.search{margin:0 16px;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:16px;background:var(--deep);border:3px solid var(--deep);box-shadow:inset 0 3px 0 rgba(0,0,0,.4);transition:border-color .2s}
.search:focus-within{border-color:var(--sun)}
.search svg{width:20px;height:20px;flex:none;color:var(--sun)}
.search input{all:unset;flex:1;min-width:0;font-family:var(--ui);font-weight:600;font-size:17px;color:#fff}
.search input::placeholder{color:#8f87d6}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 9px;border-radius:99px;font-family:var(--title);font-size:13px;color:#fff;background:#241b6c;border:2.5px solid var(--deep);box-shadow:0 3px 0 var(--deep);transition:transform .16s var(--pop),background .15s}
.chip i{width:13px;height:13px;border-radius:4px;background:var(--c,var(--sun));border:2px solid var(--deep)}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
.chip[aria-pressed=true]{background:linear-gradient(180deg,#ffe96a,#ffb52e);color:var(--ink)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 10px 16px;border-top:3px solid var(--deep);background:rgba(8,4,26,.28);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.list h4{display:flex;align-items:center;gap:8px;margin:14px 8px 5px;font-family:var(--title);font-size:13px;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.list h4 i{width:13px;height:13px;border-radius:4px;background:var(--c);border:2px solid var(--deep)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 8px;border-radius:14px;transition:background .12s,transform .16s var(--pop)}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.09);transform:translateX(4px)}
.row[aria-current=true]{background:linear-gradient(180deg,#ffe96a,#ffb52e);color:var(--ink)}
.row .th{position:relative;width:68px;height:44px;flex:none;border-radius:8px 8px 5px 5px;background:var(--c);border:2.5px solid var(--deep);box-shadow:0 3px 0 var(--deep);padding:4px 5px 7px}
.row .th img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block;background:rgba(0,0,0,.2)}
.row b{display:block;font-family:var(--title);font-weight:400;font-size:16.5px;line-height:1.1}
.row small{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-top:3px}
.none{padding:40px 10px;text-align:center;font-family:var(--title);font-size:18px;color:var(--mute)}
.toast{position:fixed;left:50%;top:86px;transform:translate(-50%,-24px) scale(.9);z-index:9;padding:11px 20px;border-radius:99px;font-family:var(--title);font-size:15px;opacity:0;transition:opacity .2s,transform .4s var(--pop);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.flash.on{opacity:1;transition-duration:.08s}
.ui{transition:opacity .5s .2s}
body.intro .ui{opacity:0;pointer-events:none;transition:none}

/* ── pantalla de título ── */
.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#3550e0 0%,#2338b0 36%,#141060 70%,#0a0828 100%);cursor:pointer}
.splash.off{visibility:hidden;opacity:0;transform:scale(1.25);transition:opacity .45s ease-in,transform .6s ease-in,visibility 0s .6s}
.sp-rays{position:absolute;left:50%;top:44%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 6deg,transparent 6deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 46%);mask-image:radial-gradient(circle,#000 0,transparent 46%);animation:spin 70s linear infinite}
.sp-stars,.sp-stars::after{position:absolute;inset:-50% 0 0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,rgba(255,255,255,.7),transparent),radial-gradient(3px 3px at 160px 60px,#fff,transparent),radial-gradient(2px 2px at 230px 190px,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 300px 90px,#fff,transparent);background-size:340px 240px;animation:drift 26s linear infinite}
.sp-stars::after{content:"";inset:0;background-size:520px 380px;opacity:.6;animation-duration:44s}
@keyframes drift{to{transform:translate3d(-340px,240px,0)}}
.sp-shape{position:absolute;animation:bob 7s ease-in-out infinite alternate;filter:drop-shadow(0 6px 0 rgba(8,4,26,.45))}
.sp-shape:nth-of-type(2n){animation-duration:9s;animation-direction:alternate-reverse}
@keyframes bob{to{transform:translate3d(14px,-26px,0) rotate(18deg)}}
.sp-mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,30px);padding:0 20px;text-align:center}
.sp-emb{width:clamp(110px,19vh,190px);height:clamp(110px,19vh,190px);filter:drop-shadow(0 8px 0 var(--deep)) drop-shadow(0 18px 30px rgba(8,4,26,.5))}
.sp-emb{animation:sway 5s ease-in-out 1.2s infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg) scale(1.04)}}
.sp-emb .ring{transform-box:view-box;transform-origin:50% 50%;animation:ringin 1s var(--pop) backwards}
.sp-emb .arc{animation:arcin .7s var(--pop) backwards}
.sp-emb .arc:nth-child(2){animation-delay:.08s}.sp-emb .arc:nth-child(3){animation-delay:.16s}.sp-emb .arc:nth-child(4){animation-delay:.24s}
.sp-emb .bar{transform-box:fill-box;transform-origin:0 50%;animation:barin .45s .55s var(--pop) backwards}
@keyframes ringin{from{transform:rotate(-200deg) scale(.2)}}
@keyframes arcin{from{opacity:0;stroke-width:0}}
@keyframes barin{from{transform:scaleX(0)}}
.sp-word{display:flex;align-items:flex-end;justify-content:center;gap:.02em;font-size:clamp(46px,10.5vw,150px);flex-wrap:wrap}
.sp-word .l{display:inline-block;animation:drop .7s var(--pop) backwards;animation-delay:calc(.45s + var(--i)*.055s)}
@keyframes drop{0%{transform:translateY(-120vh) rotate(-20deg)}60%{transform:translateY(0) scale(1.12,.84)}}
.sp-64{font-size:1.28em;margin-left:.16em;animation:slam .6s 1.15s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes slam{0%{transform:scale(5) rotate(18deg);opacity:0}60%{opacity:1}}
.sp-sub{font-family:var(--title);font-size:clamp(15px,2.1vw,25px);letter-spacing:.14em;text-transform:uppercase;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:fade .5s 1.5s backwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.sp-start{margin-top:clamp(4px,1.6vh,18px);height:68px;padding:0 30px 0 22px;font-size:25px;border-radius:99px;animation:fade .5s 1.8s backwards}
.sp-start .gl{height:32px;font-size:12px}
.sp-start b{font-weight:400;animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.splash.wait .sp-start{filter:saturate(.3) brightness(.85);pointer-events:none}
.splash.wait .sp-start .gl{animation:none}
.sp-foot{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:16px;padding:0 26px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#cfd6ff;animation:fade .6s 2s backwards}
.sp-load{display:inline-flex;align-items:center;gap:9px}
.sp-load i{display:inline-flex;gap:3px}
.sp-load i b{width:5px;height:12px;border-radius:2px;background:var(--sun);animation:pin .9s ease-in-out infinite}
.sp-load i b:nth-child(2){animation-delay:.12s}.sp-load i b:nth-child(3){animation-delay:.24s}.sp-load i b:nth-child(4){animation-delay:.36s}
@keyframes pin{50%{transform:scaleY(.35);opacity:.5}}
.splash:not(.wait) .sp-load i{display:none}
.sp-crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.13) 0 2px,transparent 2px 4px),radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(4,2,20,.6) 100%)}

@media (max-width:820px){
  :root{--pad:12px}
  .logo{font-size:23px}.logo .emb{width:34px;height:34px}
  .tabs{position:fixed;left:12px;right:12px;top:auto;bottom:max(12px,env(safe-area-inset-bottom));transform:none;justify-content:space-between}
  .tabs button{flex:1;justify-content:center;padding:0 6px;font-size:14px;height:44px}
  .tools .btn{height:44px;min-width:44px;padding:0 13px}.tools .lbl,.tools .gl{display:none}
  .card{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}
  .card h2{font-size:40px}.card h2.long{font-size:30px}
  .desc{padding:10px 13px;font-size:14.5px}.desc p{-webkit-line-clamp:2}
  .play{height:58px;font-size:22px}.rnd{width:48px;height:48px}
  .count,.keys{display:none}
  body[data-st=wall] .card{display:none}
  .sp-foot{flex-direction:column;align-items:center;gap:6px}
